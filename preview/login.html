<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link rel="icon" href="/img/favicon-32.png"><link rel="icon" href="/img/favicon-192.png" sizes="192x192">
<link rel="stylesheet" href="/src/styles/app.css">
<script src="/pre-paint.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark"><img src="/img/brand.png" alt="Superbyte UI"></div>
      Superbyte UI
      <span style="color:var(--text3);font-weight:400;font-size:11px">v1.0.0</span>
    </div>

    <button class="icon-btn auth-theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
      <span class="theme-icon-moon"><i data-lucide="moon"></i></span>
      <span class="theme-icon-sun"><i data-lucide="sun"></i></span>
    </button>

<div class="auth-panel">
  <div class="auth-shield"><i data-lucide="log-in"></i></div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your Superbyte UI account to continue.</p>

  <form id="auth-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="login-email">Email address</label>
      <input class="form-control" type="email" id="login-email" placeholder="you@example.com" required autofocus>
    </div>
    <div class="mb-3">
      <div class="d-flex justify-between mb-1">
        <label class="form-label" for="login-pass" style="margin-bottom:0">Password</label>
        <a href="forgot.html" style="font-size:11.5px;color:var(--accent-h)">Forgot password?</a>
      </div>
      <div class="input-group">
        <input class="form-control" type="password" id="login-pass" placeholder="Password" required>
        <button class="input-group-text" type="button" data-toggle-pass="login-pass" aria-label="Show password"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="remember" checked>
      <label class="form-check-label" for="remember">Remember me</label>
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in <i data-lucide="arrow-right"></i></button>
  </form>
</div>

<div class="auth-foot">Don't have an account? <a href="register.html" style="color:var(--accent-h)">Sign up</a></div>


    <div class="auth-legal">© 2026 Superbyte UI · <a href="#" onclick="showToast('success','Demo only')">Terms</a> · <a href="#" onclick="showToast('success','Demo only')">Privacy</a></div>

  </div>
</div>

<script type="module" src="/src/js/pages/auth.js"></script>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
