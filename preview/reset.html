<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password</title>
<link rel="icon" href="/img/favicon-32.png"><link rel="icon" href="/img/favicon-192.png" sizes="192x192">
<link rel="stylesheet" href="/src/styles/app.css">
<script src="/pre-paint.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark"><img src="/img/brand.png" alt="Superbyte UI"></div>
      Superbyte UI
      <span style="color:var(--text3);font-weight:400;font-size:11px">v1.0.0</span>
    </div>

    <button class="icon-btn auth-theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
      <span class="theme-icon-moon"><i data-lucide="moon"></i></span>
      <span class="theme-icon-sun"><i data-lucide="sun"></i></span>
    </button>

<div class="auth-panel">
  <div class="auth-shield"><i data-lucide="lock-keyhole"></i></div>
  <h1>Set a new password</h1>
  <p class="sub">Choose a strong password you haven't used before.</p>

  <form id="auth-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="reg-pass">New password</label>
      <div class="input-group">
        <input class="form-control" type="password" id="reg-pass" placeholder="At least 8 characters" required autofocus>
        <button class="input-group-text" type="button" data-toggle-pass="reg-pass" aria-label="Show password"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reg-cfpass">Confirm new password</label>
      <div class="input-group">
        <input class="form-control" type="password" id="reg-cfpass" placeholder="Repeat password" required>
        <button class="input-group-text" type="button" data-toggle-pass="reg-cfpass" aria-label="Show password"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Reset password <i data-lucide="check"></i></button>
  </form>
</div>

<div class="auth-foot"><a href="login.html" style="color:var(--accent-h)">Back to sign in</a></div>


    <div class="auth-legal">© 2026 Superbyte UI · <a href="#" onclick="showToast('success','Demo only')">Terms</a> · <a href="#" onclick="showToast('success','Demo only')">Privacy</a></div>

  </div>
</div>

<script type="module" src="/src/js/pages/auth.js"></script>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
