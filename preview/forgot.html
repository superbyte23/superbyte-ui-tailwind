<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password</title>
<link rel="icon" href="/img/favicon-32.png"><link rel="icon" href="/img/favicon-192.png" sizes="192x192">
<link rel="stylesheet" href="/src/styles/app.css">
<script src="/pre-paint.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark"><img src="/img/brand.png" alt="Superbyte UI"></div>
      Superbyte UI
      <span style="color:var(--text3);font-weight:400;font-size:11px">v1.0.0</span>
    </div>

    <button class="icon-btn auth-theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
      <span class="theme-icon-moon"><i data-lucide="moon"></i></span>
      <span class="theme-icon-sun"><i data-lucide="sun"></i></span>
    </button>

<div class="auth-panel">
  <div class="auth-shield"><i data-lucide="key-round"></i></div>
  <h1>Forgot password?</h1>
  <p class="sub">Enter your email address and we'll send you a reset link.</p>

  <form id="auth-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="forgot-email">Email address</label>
      <input class="form-control" type="email" id="forgot-email" placeholder="you@example.com" required autofocus>
    </div>
    <button class="btn btn-primary w-100" type="submit">Send reset link <i data-lucide="mail"></i></button>
  </form>
</div>

<div class="auth-foot">Remembered it? <a href="login.html" style="color:var(--accent-h)">Back to sign in</a></div>


    <div class="auth-legal">© 2026 Superbyte UI · <a href="#" onclick="showToast('success','Demo only')">Terms</a> · <a href="#" onclick="showToast('success','Demo only')">Privacy</a></div>

  </div>
</div>

<script type="module" src="/src/js/pages/auth.js"></script>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
