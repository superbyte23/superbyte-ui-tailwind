<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session expired</title>
<link rel="icon" href="/img/favicon-32.png"><link rel="icon" href="/img/favicon-192.png" sizes="192x192">
<link rel="stylesheet" href="/src/styles/app.css">
<script src="/pre-paint.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark"><img src="/img/brand.png" alt="Superbyte UI"></div>
      Superbyte UI
      <span style="color:var(--text3);font-weight:400;font-size:11px">v1.0.0</span>
    </div>

    <button class="icon-btn auth-theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
      <span class="theme-icon-moon"><i data-lucide="moon"></i></span>
      <span class="theme-icon-sun"><i data-lucide="sun"></i></span>
    </button>

<div class="auth-panel">
  <div class="auth-shield warn"><i data-lucide="history"></i></div>
  <h1>Session expired</h1>
  <p class="sub">Your session timed out after 15 minutes of inactivity.</p>

  <div class="text-center mb-4">
    <div style="font-size:13px;color:var(--text2);line-height:1.7">Your work is safe — just sign back in to continue.<br>Unsaved changes were kept locally.</div>
  </div>
  <div class="d-flex flex-column gap-2">
    <button class="btn btn-primary" type="button" onclick="location.href='login.html'"><i data-lucide="log-in"></i> Sign in again</button>
    <button class="btn btn-ghost" type="button" onclick="location.href='index.html'">Go to dashboard</button>
  </div>
</div>

<div class="auth-foot"></div>


    <div class="auth-legal">© 2026 Superbyte UI · <a href="#" onclick="showToast('success','Demo only')">Terms</a> · <a href="#" onclick="showToast('success','Demo only')">Privacy</a></div>

  </div>
</div>

<script type="module" src="/src/js/pages/auth.js"></script>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
