<section class="page-section active">

  <div class="page-head">
    <div><h1>Records</h1><p>orders · 248 total</p></div>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal"><i data-lucide="plus"></i> New record</button>
  </div>

  <div class="card">
    <div class="table-toolbar">
      <div class="d-flex gap-2 flex-wrap">
        <div class="search-wrap"><i data-lucide="search" class="search-icon"></i><input class="search-input" id="table-search" placeholder="Filter records…"></div>
        <button class="btn btn-ghost btn-sm" onclick="showToast('success','Filter applied')"><i data-lucide="filter"></i> Filters</button>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-ghost btn-sm" onclick="showToast('success','Sorted')"><i data-lucide="arrow-up-down"></i> Sort</button>
        <button class="btn btn-ghost btn-sm" onclick="showToast('success','Exported')"><i data-lucide="file-output"></i> Export</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="data-table" id="records-table">
        <thead>
          <tr>
            <th class="cell-check" style="width:36px"><input type="checkbox" id="check-all" aria-label="Select all"></th>
            <th data-col="id">ORDER</th>
            <th data-col="customer">CUSTOMER</th>
            <th data-col="status">STATUS</th>
            <th data-col="date">DATE</th>
            <th data-col="total">TOTAL</th>
            <th style="width:90px"></th>
          </tr>
        </thead>
        <tbody id="records-tbody"></tbody>
      </table>
    </div>
    <div class="empty-state d-none" id="records-empty"><i data-lucide="inbox"></i><p>No records match your filter</p></div>
    <div class="d-flex align-center justify-between px-3 py-3" style="border-top:1px solid var(--border)">
      <span style="font-size:12px;color:var(--text3)" class="font-mono" id="records-count">Showing 1–8 of 248</span>
      <nav><ul class="pagination pagination-sm mb-0">
        <li class="page-item disabled"><span class="page-link"><i data-lucide="chevron-left"></i></span></li>
        <li class="page-item active"><span class="page-link">1</span></li>
        <li class="page-item"><span class="page-link">2</span></li>
        <li class="page-item"><span class="page-link">3</span></li>
        <li class="page-item"><span class="page-link">…</span></li>
        <li class="page-item"><span class="page-link">31</span></li>
        <li class="page-item"><span class="page-link"><i data-lucide="chevron-right"></i></span></li>
      </ul></nav>
    </div>
  </div>

  <div class="sel-pill-wrap">
    <div id="sel-toolbar">
      <span><span class="sel-count" id="sel-count">0</span> selected</span>
      <div class="sep"></div>
      <span role="button" onclick="showToast('success','Exported selection')"><i data-lucide="file-output"></i> Export</span>
      <div class="sep"></div>
      <span role="button" style="color:var(--danger)" onclick="deleteSelected()"><i data-lucide="trash-2"></i> Delete</span>
    </div>
  </div>

</section>
