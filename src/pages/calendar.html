<section class="page-section active">

  <div class="page-head">
    <div><h1>Calendar</h1><p>August 2026 — click a day, jump a month, review upcoming events</p></div>
  </div>

  <div class="g-row g-4 cols-2" style="grid-template-columns:minmax(0,1fr) minmax(0,300px);align-items:start">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i data-lucide="calendar-days"></i> <span id="cal-title">August 2026</span></div>
        <div class="d-flex align-center gap-2">
          <button type="button" class="icon-btn" id="cal-prev" title="Previous month"><i data-lucide="chevron-left"></i></button>
          <button type="button" class="icon-btn" id="cal-next" title="Next month"><i data-lucide="chevron-right"></i></button>
          <button type="button" class="btn btn-sm btn-ghost" id="cal-today">Today</button>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <div class="cal-head">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

    <div class="d-flex flex-column gap-4">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="calendar-fold"></i> Jump to month</div>
        </div>
        <div class="card-body">
          <div class="d-flex flex-wrap gap-2" id="cal-months"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="list-checks"></i> Upcoming</div>
        </div>
        <div id="cal-upcoming"></div>
      </div>
    </div>
  </div>

</section>
