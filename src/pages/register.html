<!--
title: Register
layout: auth
script: auth
active: register
-->

<div class="auth-panel">
  <div class="auth-shield"><i data-lucide="user-plus"></i></div>
  <h1>Create account</h1>
  <p class="sub">Start your 14-day free trial. No credit card required.</p>

  <form id="auth-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="reg-name">Full name</label>
      <input class="form-control" type="text" id="reg-name" placeholder="John Canete" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reg-email">Email address</label>
      <input class="form-control" type="email" id="reg-email" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reg-pass">Password</label>
      <div class="input-group">
        <input class="form-control" type="password" id="reg-pass" placeholder="Create a password" required>
        <button class="input-group-text" type="button" data-toggle-pass="reg-pass" aria-label="Show password"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reg-cfpass">Confirm password</label>
      <div class="input-group">
        <input class="form-control" type="password" id="reg-cfpass" placeholder="Repeat password" required>
        <button class="input-group-text" type="button" data-toggle-pass="reg-cfpass" aria-label="Show password"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="reg-terms" required>
      <label class="form-check-label" for="reg-terms">I agree to the <a href="#" style="color:var(--accent-h)" onclick="showToast('success','Demo only')">Terms</a> and <a href="#" style="color:var(--accent-h)" onclick="showToast('success','Demo only')">Privacy Policy</a></label>
    </div>
    <button class="btn btn-primary w-100" type="submit">Create account <i data-lucide="arrow-right"></i></button>
  </form>
</div>

<div class="auth-foot">Already have an account? <a href="login.html" style="color:var(--accent-h)">Sign in</a></div>
