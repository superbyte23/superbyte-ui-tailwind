<section class="page-section active">

  <div class="page-head">
    <div><h1>Icons</h1><p>Lucide — every icon ships in the bundle, searchable and click-to-copy</p></div>
  </div>

  <div class="card">
    <div class="card-header d-flex align-center gap-2">
      <div class="card-title flex-1"><i data-lucide="sparkles"></i> Icon browser</div>
      <span class="badge" id="icons-count">0 icons</span>
    </div>
    <div class="table-toolbar">
      <div class="search-wrap">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" class="form-control search-input" id="icons-search" placeholder="Search icons… (e.g. bell, chart, user)">
      </div>
      <div class="d-flex align-center gap-2">
        <label class="form-label" style="margin:0;font-size:11px">Stroke</label>
        <select class="form-select" id="icons-stroke" style="width:150px;padding:5px 8px;font-size:12px">
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2" selected>2</option>
          <option value="2.5">2.5</option>
        </select>
      </div>
    </div>
    <div class="icons-grid" id="icons-grid"></div>
    <div class="empty-state d-none" id="icons-empty"><i data-lucide="search-x" style="width:34px;height:34px"></i><p>No icons match "<span id="icons-empty-q"></span>".</p></div>
  </div>

</section>
