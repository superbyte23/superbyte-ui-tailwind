<div class="auth-panel">
  <div class="auth-shield"><i data-lucide="key-round"></i></div>
  <h1>Forgot password?</h1>
  <p class="sub">Enter your email address and we'll send you a reset link.</p>

  <form id="auth-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="forgot-email">Email address</label>
      <input class="form-control" type="email" id="forgot-email" placeholder="you@example.com" required autofocus>
    </div>
    <button class="btn btn-primary w-100" type="submit">Send reset link <i data-lucide="mail"></i></button>
  </form>
</div>

<div class="auth-foot">Remembered it? <a href="login.html" style="color:var(--accent-h)">Back to sign in</a></div>
