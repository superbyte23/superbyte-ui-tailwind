<section class="page-section active">

  <div class="page-head">
    <div>
      <h1>File Manager</h1>
      <p id="fm-crumb"><a href="#" style="color:var(--accent-h)">Root</a> <span style="color:var(--text3)">/</span> Projects</p>
    </div>
    <div class="d-flex align-center gap-2">
      <div class="search-wrap">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" class="form-control search-input" id="fm-search" placeholder="Search files…">
      </div>
      <button type="button" class="btn btn-primary" id="fm-upload"><i data-lucide="upload"></i> Upload</button>
    </div>
  </div>

  <div class="g-row g-4 cols-4" id="fm-grid"></div>

  <div class="card mt-4">
    <div class="card-header">
      <div class="card-title"><i data-lucide="hard-drive"></i> Storage</div>
    </div>
    <div class="card-body">
      <div class="d-flex justify-between mb-1"><span style="font-size:12.5px;color:var(--text2)">1.4 GB of 2.0 GB used</span><span class="tag tag-amber">70%</span></div>
      <div class="progress"><div class="progress-bar" style="width:70%;background:var(--yellow)"></div></div>
    </div>
  </div>

</section>
