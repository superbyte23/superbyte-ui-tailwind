title: Login
layout: auth
script: auth
active: login
-->

<div class="auth-panel">
  <div class="auth-shield"><i data-lucide="log-in"></i></div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your Superbyte UI account to continue.</p>

  <form id="auth-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="login-email">Email address</label>
      <input class="form-control" type="email" id="login-email" placeholder="you@example.com" required autofocus>
    </div>
    <div class="mb-3">
      <div class="d-flex justify-between mb-1">
        <label class="form-label" for="login-pass" style="margin-bottom:0">Password</label>
        <a href="forgot.html" style="font-size:11.5px;color:var(--accent-h)">Forgot password?</a>
      </div>
      <div class="input-group">
        <input class="form-control" type="password" id="login-pass" placeholder="Password" required>
        <button class="input-group-text" type="button" data-toggle-pass="login-pass" aria-label="Show password"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="remember" checked>
      <label class="form-check-label" for="remember">Remember me</label>
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in <i data-lucide="arrow-right"></i></button>
  </form>
</div>

<div class="auth-foot">Don't have an account? <a href="register.html" style="color:var(--accent-h)">Sign up</a></div>
